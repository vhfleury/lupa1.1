[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lupa"
version = "0.0.1"
description = "Lupa: apoio à análise de processos judiciais"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.11.10",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "structlog==24.4.0",
    "pyyaml==6.0.2",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "geoip2==5.3.0",
    "pymupdf==1.25.1",
    "pillow==11.0.0",
    "numpy==2.2.1",
    "redis==5.2.1",
    "rq==2.1.0",
    "boto3==1.35.36",
    "prometheus-client==0.21.1",
    "claude-agent-sdk==0.2.170",
    "cryptography==50.0.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.1",
    "httpx==0.28.1",
    "types-PyYAML==6.0.12.20241230",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP", "B", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*", "pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=lupa --cov-report=term-missing --cov-fail-under=90 -m 'not carga and not llm'"
markers = [
    "integracao: exige PostgreSQL e MinIO acessíveis",
    "carga: teste de carga lento (1 milhão de eventos); rode com `pytest -m carga --no-cov`",
    "injecao: regressão do saneamento contra o corpus de injeção (.sinteticos/injecao)",
    "agente: suíte de injeção do agente sobre autos ingeridos (Etapa 5.8)",
    "llm: smoke do cliente real do modelo; só com credencial (`pytest -m llm --no-cov`)",
]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:datetime.datetime.utcnow.. is deprecated:DeprecationWarning:botocore",
]
