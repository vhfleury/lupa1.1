# Prometheus do Lupa (Etapa 8.1, perfil `monitoramento`). Raspa a API direto na rede interna
# (sem passar pelo proxy) com o token de servico lido do segredo /run/secrets/metricas_token.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/regras.yml

scrape_configs:
  - job_name: lupa
    metrics_path: /metricas/servico
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metricas_token
    static_configs:
      - targets: ["api:8000"]
